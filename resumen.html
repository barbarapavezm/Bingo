<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Resumen de caja - Bingo</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      background: #f4f6f8;
      color: #1f2937;
    }

    header {
      background: white;
      padding: 20px 30px;
      border-bottom: 1px solid #ddd;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    header a {
      text-decoration: none;
      color: #2563eb;
      font-weight: bold;
    }

    main {
      max-width: 1200px;
      margin: auto;
      padding: 30px;
    }

    .grid-resumen {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 18px;
      margin-bottom: 30px;
    }

    .card {
      background: white;
      padding: 22px;
      border-radius: 14px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    .card .titulo {
      color: #6b7280;
      font-size: 14px;
      margin-bottom: 8px;
    }

    .card .valor {
      font-size: 28px;
      font-weight: bold;
    }

    .panel {
      background: white;
      padding: 22px;
      border-radius: 14px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
      margin-bottom: 25px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 15px;
    }

    th, td {
      text-align: left;
      padding: 12px;
      border-bottom: 1px solid #e5e7eb;
      vertical-align: top;
    }

    th {
      background: #f9fafb;
    }

    .estado-cargando {
      color: #6b7280;
      margin-top: 10px;
    }

    .producto-lista {
      margin: 2px 0;
    }

    .persona {
      color: #4b5563;
      margin-top: 4px;
    }

    .acciones {
      display: flex;
      flex-direction: column;
      gap: 6px;
      min-width: 90px;
    }

    .btn-editar,
    .btn-eliminar {
      border: none;
      border-radius: 7px;
      padding: 8px 10px;
      cursor: pointer;
      font-size: 13px;
    }

    .btn-editar {
      background: #e5e7eb;
      color: #111827;
    }

    .btn-eliminar {
      background: #fee2e2;
      color: #991b1b;
    }

    .error {
      color: #b91c1c;
      font-weight: bold;
    }

    @media (max-width: 800px) {
      main {
        padding: 20px;
      }

      table {
        font-size: 13px;
      }

      .acciones {
        min-width: 70px;
      }
    }
  </style>
</head>

<body>

<header>
  <div>
    <h1>Resumen de caja</h1>
    <span>Ventas acumuladas del evento</span>
  </div>

  <a href="/index.html">Volver al inicio</a>
</header>

<main>

  <div class="grid-resumen">

    <div class="card">
      <div class="titulo">Total vendido</div>
      <div class="valor" id="total-vendido">$0</div>
    </div>

    <div class="card">
      <div class="titulo">Efectivo</div>
      <div class="valor" id="total-efectivo">$0</div>
    </div>

    <div class="card">
      <div class="titulo">Transferencias</div>
      <div class="valor" id="total-transferencia">$0</div>
    </div>

    <div class="card">
      <div class="titulo">Cantidad de ventas</div>
      <div class="valor" id="cantidad-ventas">0</div>
    </div>

  </div>

  <div class="panel">

    <h2>Productos vendidos</h2>

    <table>
      <thead>
        <tr>
          <th>Producto</th>
          <th>Cantidad vendida</th>
          <th>Dinero generado</th>
        </tr>
      </thead>

      <tbody id="tabla-productos">
      </tbody>
    </table>

  </div>

  <div class="panel">

    <h2>Historial de ventas</h2>

    <div id="estado" class="estado-cargando">
      Cargando ventas...
    </div>

    <table id="tabla-historial" style="display:none;">
      <thead>
        <tr>
          <th>Fecha</th>
          <th>Mesa / Persona</th>
          <th>Productos</th>
          <th>Pago</th>
          <th>Total</th>
          <th>Acciones</th>
        </tr>
      </thead>

      <tbody id="historial-ventas">
      </tbody>
    </table>

  </div>

</main>

<script>

function formatoCLP(valor) {
  return new Intl.NumberFormat("es-CL", {
    style: "currency",
    currency: "CLP",
    maximumFractionDigits: 0
  }).format(valor);
}

function formatoFecha(fechaISO) {
  const fecha = new Date(fechaISO);

  return fecha.toLocaleString("es-CL", {
    dateStyle: "short",
    timeStyle: "short"
  });
}

async function obtenerVentas() {
  const respuesta = await fetch(
    "/.netlify/functions/ventas"
  );

  if (!respuesta.ok) {
    throw new Error(
      "No se pudieron cargar las ventas."
    );
  }

  return await respuesta.json();
}

async function cargarResumen() {

  const estado =
    document.getElementById("estado");

  try {

    const ventas =
      await obtenerVentas();

    let totalVendido = 0;
    let totalEfectivo = 0;
    let totalTransferencia = 0;

    const resumenProductos = {};

    ventas.forEach(venta => {

      totalVendido +=
        Number(venta.total || 0);

      if (
        venta.metodoPago ===
        "efectivo"
      ) {
        totalEfectivo +=
          Number(venta.total || 0);
      }

      if (
        venta.metodoPago ===
        "transferencia"
      ) {
        totalTransferencia +=
          Number(venta.total || 0);
      }

      const productosVenta =
        Array.isArray(venta.productos)
          ? venta.productos
          : [];

      productosVenta.forEach(
        producto => {

          if (
            !resumenProductos[
              producto.nombre
            ]
          ) {
            resumenProductos[
              producto.nombre
            ] = {
              cantidad: 0,
              dinero: 0
            };
          }

          resumenProductos[
            producto.nombre
          ].cantidad +=
            Number(
              producto.cantidad || 0
            );

          resumenProductos[
            producto.nombre
          ].dinero +=
            Number(
              producto.subtotal || 0
            );
        }
      );
    });

    document.getElementById(
      "total-vendido"
    ).textContent =
      formatoCLP(totalVendido);

    document.getElementById(
      "total-efectivo"
    ).textContent =
      formatoCLP(totalEfectivo);

    document.getElementById(
      "total-transferencia"
    ).textContent =
      formatoCLP(totalTransferencia);

    document.getElementById(
      "cantidad-ventas"
    ).textContent =
      ventas.length;

    renderProductos(
      resumenProductos
    );

    renderHistorial(
      ventas
    );

    estado.style.display =
      "none";

    document.getElementById(
      "tabla-historial"
    ).style.display =
      "table";

  } catch (error) {

    console.error(error);

    estado.className =
      "error";

    estado.textContent =
      "No se pudo cargar el resumen de ventas.";
  }
}

function renderProductos(
  resumenProductos
) {

  const tbody =
    document.getElementById(
      "tabla-productos"
    );

  tbody.innerHTML = "";

  const nombres =
    Object.keys(
      resumenProductos
    );

  if (
    nombres.length === 0
  ) {

    tbody.innerHTML = `
      <tr>
        <td colspan="3">
          Aún no hay productos vendidos.
        </td>
      </tr>
    `;

    return;
  }

  nombres
    .sort()
    .forEach(nombre => {

      const datos =
        resumenProductos[
          nombre
        ];

      const fila =
        document.createElement(
          "tr"
        );

      fila.innerHTML = `
        <td>${nombre}</td>

        <td>
          ${datos.cantidad}
        </td>

        <td>
          ${formatoCLP(
            datos.dinero
          )}
        </td>
      `;

      tbody.appendChild(
        fila
      );
    });
}

function renderHistorial(
  ventas
) {

  const tbody =
    document.getElementById(
      "historial-ventas"
    );

  tbody.innerHTML = "";

  if (
    ventas.length === 0
  ) {

    tbody.innerHTML = `
      <tr>
        <td colspan="6">
          Aún no hay ventas registradas.
        </td>
      </tr>
    `;

    return;
  }

  ventas.forEach(
    venta => {

      const productosVenta =
        Array.isArray(
          venta.productos
        )
          ? venta.productos
          : [];

      const productosHTML =
        productosVenta
          .map(
            producto => `
              <div class="producto-lista">
                ${producto.cantidad}
                x
                ${producto.nombre}
              </div>
            `
          )
          .join("");

      const nombrePersona =
        venta.nombre
          ? venta.nombre
          : "Sin nombre";

      const metodoPago =
        venta.metodoPago ===
        "efectivo"
          ? "Efectivo"
          : "Transferencia";

      const fila =
        document.createElement(
          "tr"
        );

      fila.innerHTML = `

        <td>
          ${formatoFecha(
            venta.fecha
          )}
        </td>

        <td>
          <strong>
            Mesa ${venta.mesa}
          </strong>

          <div class="persona">
            ${nombrePersona}
          </div>
        </td>

        <td>
          ${productosHTML}
        </td>

        <td>
          ${metodoPago}
        </td>

        <td>
          <strong>
            ${formatoCLP(
              venta.total
            )}
          </strong>
        </td>

        <td>
          <div class="acciones">

            <button
              class="btn-editar"
              onclick="editarVenta('${venta.id}')"
            >
              ✏️ Editar
            </button>

            <button
              class="btn-eliminar"
              onclick="eliminarVenta('${venta.id}')"
            >
              🗑️ Eliminar
            </button>

          </div>
        </td>
      `;

      tbody.appendChild(
        fila
      );
    });
}

async function eliminarVenta(id) {

  const confirmar =
    confirm(
      "¿Seguro que quieres eliminar esta venta?\n\n" +
      "Se descontará del total de caja y de los productos vendidos."
    );

  if (!confirmar) {
    return;
  }

  try {

    const respuesta =
      await fetch(
        "/.netlify/functions/ventas?id=" +
        encodeURIComponent(id),
        {
          method: "DELETE"
        }
      );

    const resultado =
      await respuesta.json();

    if (!respuesta.ok) {
      throw new Error(
        resultado.error ||
        "No se pudo eliminar."
      );
    }

    alert(
      "✅ Venta eliminada correctamente."
    );

    location.reload();

  } catch (error) {

    console.error(error);

    alert(
      "❌ No se pudo eliminar la venta."
    );
  }
}

async function editarVenta(id) {

  try {

    const ventas =
      await obtenerVentas();

    const venta =
      ventas.find(
        v => v.id === id
      );

    if (!venta) {
      alert(
        "Venta no encontrada."
      );
      return;
    }


    const nuevaMesa =
      prompt(
        "Número de mesa:",
        venta.mesa
      );

    if (
      nuevaMesa === null
    ) {
      return;
    }

    const mesaNumero =
      Number(nuevaMesa);

    if (
      !Number.isInteger(
        mesaNumero
      ) ||
      mesaNumero < 1 ||
      mesaNumero > 50
    ) {

      alert(
        "La mesa debe ser un número entre 1 y 50."
      );

      return;
    }


    const nuevoNombre =
      prompt(
        "Nombre de la persona:",
        venta.nombre || ""
      );

    if (
      nuevoNombre === null
    ) {
      return;
    }

    if (
      !nuevoNombre.trim()
    ) {

      alert(
        "El nombre no puede quedar vacío."
      );

      return;
    }


    const nuevoPago =
      prompt(
        "Método de pago:\n" +
        "Escribe efectivo o transferencia",
        venta.metodoPago
      );

    if (
      nuevoPago === null
    ) {
      return;
    }

    const pagoNormalizado =
      nuevoPago
        .trim()
        .toLowerCase();

    if (
      pagoNormalizado !==
        "efectivo" &&
      pagoNormalizado !==
        "transferencia"
    ) {

      alert(
        "El método debe ser efectivo o transferencia."
      );

      return;
    }


    const productosEditados = [];

    const productosVenta =
      Array.isArray(
        venta.productos
      )
        ? venta.productos
        : [];

    for (
      const producto
      of productosVenta
    ) {

      const nuevaCantidad =
        prompt(
          "Cantidad de " +
          producto.nombre +
          ":",
          producto.cantidad
        );

      if (
        nuevaCantidad === null
      ) {
        return;
      }

      const cantidad =
        Number(
          nuevaCantidad
        );

      if (
        !Number.isInteger(
          cantidad
        ) ||
        cantidad < 0
      ) {

        alert(
          "La cantidad debe ser un número entero igual o mayor que 0."
        );

        return;
      }

      if (
        cantidad > 0
      ) {

        productosEditados.push({
          ...producto,
          cantidad,
          subtotal:
            Number(
              producto.precio
            ) *
            cantidad
        });
      }
    }


    if (
      productosEditados.length ===
      0
    ) {

      alert(
        "La venta debe tener al menos un producto.\n\n" +
        "Si quieres eliminarla completamente, usa el botón Eliminar."
      );

      return;
    }


    const ventaActualizada = {
      id:
        venta.id,

      mesa:
        mesaNumero,

      nombre:
        nuevoNombre.trim(),

      metodoPago:
        pagoNormalizado,

      productos:
        productosEditados
    };


    const guardar =
      await fetch(
        "/.netlify/functions/ventas",
        {
          method: "PUT",

          headers: {
            "Content-Type":
              "application/json"
          },

          body:
            JSON.stringify(
              ventaActualizada
            )
        }
      );


    const resultado =
      await guardar.json();


    if (!guardar.ok) {

      throw new Error(
        resultado.error ||
        "No se pudo editar."
      );
    }


    alert(
      "✅ Venta actualizada correctamente."
    );

    location.reload();

  } catch (error) {

    console.error(error);

    alert(
      "❌ No se pudo editar la venta."
    );
  }
}

cargarResumen();

</script>

</body>
</html>
