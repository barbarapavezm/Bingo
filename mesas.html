<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mesas - Bingo</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      margin: 0;
      background: #f4f6f8;
      color: #1f2937;
    }

    header {
      background: white;
      padding: 20px 30px;
      border-bottom: 1px solid #ddd;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    header a {
      text-decoration: none;
      color: #2563eb;
      font-weight: bold;
    }

    main {
      max-width: 1500px;
      margin: auto;
      padding: 30px;
    }

    .resumen {
      background: white;
      padding: 20px;
      border-radius: 14px;
      margin-bottom: 25px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
      gap: 15px;
    }

    .mesa {
      background: white;
      border-radius: 14px;
      padding: 18px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
      border: 2px solid #e5e7eb;
    }

    .mesa.activa {
      border-color: #f59e0b;
    }

    .mesa h3 {
      margin-top: 0;
      margin-bottom: 12px;
    }

    .dato {
      font-size: 14px;
      margin: 6px 0;
      color: #4b5563;
    }

    .estado {
      display: inline-block;
      margin-top: 10px;
      padding: 6px 10px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: bold;
      background: #e5e7eb;
    }

    .estado.activo {
      background: #fef3c7;
      color: #92400e;
    }

    .btn {
      display: inline-block;
      margin-top: 14px;
      text-decoration: none;
      background: #2563eb;
      color: white;
      padding: 9px 12px;
      border-radius: 8px;
      font-size: 14px;
    }

    .cargando {
      color: #6b7280;
    }

    .error {
      color: #b91c1c;
    }
  </style>
</head>

<body>

<header>
  <div>
    <h1>Mesas</h1>
    <span>Vista general de las 50 mesas</span>
  </div>

  <a href="/index.html">Volver al inicio</a>
</header>

<main>

  <div class="resumen">
    <strong>Total de mesas:</strong> 50
    <br>

    <span id="estado-carga" class="cargando">
      Cargando información...
    </span>
  </div>

  <div class="grid" id="grid-mesas"></div>

</main>

<script>

const productosEntregables = [
  "completo",
  "té",
  "te",
  "café",
  "cafe",
  "bebida",
  "agua"
];

function normalizar(texto) {
  return String(texto || "")
    .trim()
    .toLowerCase();
}

function esEntregable(producto) {

  if (producto.categoria === "comida") {
    return true;
  }

  return productosEntregables.includes(
    normalizar(producto.nombre)
  );
}

async function obtenerDatos() {

  const marcaTiempo = Date.now();

  const [respuestaVentas, respuestaPedidos] =
    await Promise.all([

      fetch(
        "/.netlify/functions/ventas?t=" + marcaTiempo,
        {
          cache: "no-store"
        }
      ),

      fetch(
        "/.netlify/functions/pedidos?t=" + marcaTiempo,
        {
          cache: "no-store"
        }
      )

    ]);

  if (!respuestaVentas.ok) {
    throw new Error(
      "No se pudieron cargar las ventas."
    );
  }

  const ventas =
    await respuestaVentas.json();

  let pedidos = [];

  if (respuestaPedidos.ok) {
    pedidos =
      await respuestaPedidos.json();
  }

  return {
    ventas:
      Array.isArray(ventas)
        ? ventas
        : [],

    pedidos:
      Array.isArray(pedidos)
        ? pedidos
        : []
  };
}

async function crearMesas() {

  const grid =
    document.getElementById(
      "grid-mesas"
    );

  const estadoCarga =
    document.getElementById(
      "estado-carga"
    );

  try {

    const {
      ventas,
      pedidos
    } = await obtenerDatos();

    grid.innerHTML = "";

    for (
      let numeroMesa = 1;
      numeroMesa <= 50;
      numeroMesa++
    ) {

      /* ========================
         VENTAS DE ESTA MESA
      ======================== */

      const ventasMesa =
        ventas.filter(
          venta =>
            Number(venta.mesa) ===
            numeroMesa
        );


      /* ========================
         PEDIDOS DE ESTA MESA
      ======================== */

      const pedidosMesa =
        pedidos.filter(
          pedido =>
            Number(pedido.mesa) ===
            numeroMesa
        );


      /* ========================
         PRODUCTOS COMPRADOS
      ======================== */

      let productosComprados = 0;

      const personas =
        new Set();


      ventasMesa.forEach(
        venta => {

          if (venta.nombre) {
            personas.add(
              normalizar(
                venta.nombre
              )
            );
          }

          const productos =
            Array.isArray(
              venta.productos
            )
              ? venta.productos
              : [];

          productos.forEach(
            producto => {

              if (
                esEntregable(
                  producto
                )
              ) {

                productosComprados +=
                  Number(
                    producto.cantidad || 0
                  );
              }

            }
          );

        }
      );


      /* ========================
         PRODUCTOS YA PEDIDOS
      ======================== */

      let productosPedidos = 0;


      pedidosMesa.forEach(
        pedido => {

          const productos =
            Array.isArray(
              pedido.productos
            )
              ? pedido.productos
              : [];

          productos.forEach(
            producto => {

              productosPedidos +=
                Number(
                  producto.cantidad || 0
                );

            }
          );

        }
      );


      /* ========================
         DISPONIBLES
      ======================== */

      const productosDisponibles =
        Math.max(
          0,
          productosComprados -
          productosPedidos
        );


      /* ========================
         PEDIDOS ACTIVOS
      ======================== */

      const pedidosActivos =
        pedidosMesa.filter(
          pedido =>
            pedido.estado !==
            "entregado"
        ).length;


      /* ========================
         ACTIVIDAD
      ======================== */

      const tieneActividad =
        ventasMesa.length > 0 ||
        pedidosMesa.length > 0;


      /* ========================
         TARJETA
      ======================== */

      const tarjeta =
        document.createElement(
          "div"
        );

      tarjeta.className =
        "mesa" +
        (
          tieneActividad
            ? " activa"
            : ""
        );


      tarjeta.innerHTML = `

        <h3>
          Mesa ${numeroMesa}
        </h3>

        <div class="dato">

          Productos comprados:
          <strong>
            ${productosComprados}
          </strong>

        </div>

        <div class="dato">

          Productos disponibles:
          <strong>
            ${productosDisponibles}
          </strong>

        </div>

        <div class="dato">

          Personas con compra:
          <strong>
            ${personas.size}
          </strong>

        </div>

        <div class="dato">

          Pedidos activos:
          <strong>
            ${pedidosActivos}
          </strong>

        </div>

        <div
          class="
            estado
            ${
              tieneActividad
                ? "activo"
                : ""
            }
          "
        >

          ${
            tieneActividad
              ? "Con actividad"
              : "Sin actividad"
          }

        </div>

        <br>

        <a
          class="btn"
          href="/mesa.html?numero=${numeroMesa}"
        >
          Ver detalle
        </a>
      `;

      grid.appendChild(
        tarjeta
      );
    }


    estadoCarga.textContent =
      "Información actualizada con compras y pedidos.";

  } catch (error) {

    console.error(error);

    estadoCarga.className =
      "error";

    estadoCarga.textContent =
      "No se pudo cargar la información.";

  }
}

crearMesas();

/*
  También refrescamos automáticamente,
  porque caja y cocina pueden cambiar
  los datos desde otros dispositivos.
*/

setInterval(
  crearMesas,
  5000
);

</script>

</body>
</html>
