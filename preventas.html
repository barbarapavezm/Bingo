<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>Preventas - Bingo</title>

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f4f6f8;
  color: #1f2937;
}

header {
  background: white;
  border-bottom: 1px solid #ddd;
  padding: 20px 28px;

  display: flex;
  justify-content: space-between;
  align-items: center;
}

header h1 {
  margin: 0 0 4px;
}

header span {
  color: #6b7280;
}

header a {
  color: #2563eb;
  text-decoration: none;
  font-weight: bold;
}

main {
  max-width: 1150px;
  margin: auto;
  padding: 25px;
}

.panel {
  background: white;

  border-radius: 14px;

  padding: 22px;

  margin-bottom: 20px;

  box-shadow:
    0 2px 8px
    rgba(0,0,0,.08);
}


/* =========================
   RESUMEN
========================= */

.resumen {
  display: grid;

  grid-template-columns:
    repeat(3, 1fr);

  gap: 15px;

  margin-bottom: 20px;
}

.resumen-box {
  background: white;

  border-radius: 14px;

  padding: 20px;

  box-shadow:
    0 2px 8px
    rgba(0,0,0,.08);
}

.resumen-numero {
  font-size: 34px;
  font-weight: bold;
}

.resumen-texto {
  color: #6b7280;
  margin-top: 5px;
}

.morado {
  color: #7c3aed;
}

.azul {
  color: #2563eb;
}

.verde {
  color: #059669;
}


/* =========================
   BUSCADOR
========================= */

.buscador {
  display: grid;

  grid-template-columns:
    1fr auto;

  gap: 12px;

  align-items: end;
}

label {
  display: block;

  margin-bottom: 7px;

  font-weight: bold;
}

input {
  width: 100%;

  padding: 13px;

  font-size: 16px;

  border:
    1px solid #ccc;

  border-radius: 9px;
}

.actualizar {
  border: none;

  background: #2563eb;

  color: white;

  border-radius: 9px;

  padding: 13px 18px;

  font-weight: bold;

  cursor: pointer;
}


/* =========================
   TABLA
========================= */

.tabla-contenedor {
  overflow-x: auto;
}

table {
  width: 100%;

  border-collapse: collapse;

  min-width: 820px;
}

th {
  text-align: left;

  padding: 13px;

  background: #f9fafb;

  border-bottom:
    2px solid #e5e7eb;
}

td {
  padding: 14px 13px;

  border-bottom:
    1px solid #e5e7eb;

  vertical-align: middle;
}

.nombre {
  font-weight: bold;
}

.cantidad {
  font-size: 18px;
  font-weight: bold;
}

.codigo {
  font-family: monospace;

  font-size: 18px;

  letter-spacing: 2px;

  font-weight: bold;

  color: #6d28d9;
}


/* =========================
   ESTADO
========================= */

.estado {
  display: inline-block;

  padding: 7px 10px;

  border-radius: 999px;

  font-size: 13px;

  font-weight: bold;
}

.estado-activo {
  background: #d1fae5;
  color: #047857;
}

.estado-inactivo {
  background: #f3f4f6;
  color: #6b7280;
}


/* =========================
   BOTONES
========================= */

button {
  border: none;
  cursor: pointer;
}

.btn-activo {
  padding: 9px 12px;

  border-radius: 8px;

  font-weight: bold;

  background: #10b981;
  color: white;
}

.btn-inactivo {
  padding: 9px 12px;

  border-radius: 8px;

  font-weight: bold;

  background: #e5e7eb;
  color: #374151;
}

.btn-copiar {
  margin-left: 6px;

  padding: 6px 9px;

  border-radius: 7px;

  background: #ede9fe;

  color: #6d28d9;

  font-weight: bold;
}

button:disabled {
  opacity: .5;
  cursor: not-allowed;
}


/* =========================
   MESA
========================= */

.mesa {
  font-weight: bold;
  color: #2563eb;
}

.sin-mesa {
  color: #9ca3af;
}


/* =========================
   VACÍO
========================= */

.vacio {
  text-align: center;

  color: #6b7280;

  padding: 40px 20px;
}


/* =========================
   HORA
========================= */

.hora {
  display: block;

  margin-top: 4px;

  font-size: 12px;

  color: #6b7280;
}


@media (max-width: 750px) {

  header {
    padding: 16px;
  }

  main {
    padding: 15px;
  }

  .resumen {
    grid-template-columns: 1fr;
  }

  .buscador {
    grid-template-columns: 1fr;
  }

}

</style>

</head>


<body>


<header>

<div>

<h1>
  🎟️ Preventas
</h1>

<span>
  Control de preventas y llegadas
</span>

</div>

<a href="/index.html">
  Volver al inicio
</a>

</header>


<main>


<!-- =========================
     RESUMEN
========================= -->

<div class="resumen">


<div class="resumen-box">

<div
  id="cantidad-personas"
  class="resumen-numero morado"
>
  0
</div>

<div class="resumen-texto">
  Personas con preventa
</div>

</div>


<div class="resumen-box">

<div
  id="cantidad-preventas"
  class="resumen-numero azul"
>
  0
</div>

<div class="resumen-texto">
  Preventas vendidas
</div>

</div>


<div class="resumen-box">

<div
  id="cantidad-activos"
  class="resumen-numero verde"
>
  0
</div>

<div class="resumen-texto">
  Personas que llegaron
</div>

</div>


</div>



<!-- =========================
     BUSCADOR
========================= -->

<div class="panel">

<div class="buscador">


<div>

<label for="buscar">
  Buscar persona
</label>

<input
  id="buscar"
  type="text"
  placeholder="Escribe nombre o código..."
  autocomplete="off"
  oninput="mostrarPreventas()"
>

</div>


<button
  class="actualizar"
  onclick="cargarPreventas()"
>
  Actualizar
</button>


</div>

</div>



<!-- =========================
     TABLA
========================= -->

<div class="panel">

<div class="tabla-contenedor">

<table>

<thead>

<tr>

<th>
  Nombre
</th>

<th>
  Preventas
</th>

<th>
  Código
</th>

<th>
  Mesa
</th>

<th>
  Estado
</th>

<th>
  Acción
</th>

</tr>

</thead>


<tbody id="lista">

<tr>

<td
  colspan="6"
  class="vacio"
>
  Cargando...
</td>

</tr>

</tbody>

</table>

</div>

</div>


</main>



<script>


let preventas =
  [];


let cambiandoEstado =
  new Set();


/* =========================
   NORMALIZAR
========================= */

function normalizar(texto) {

  return String(
    texto || ""
  )
    .trim()
    .toLowerCase()
    .normalize("NFD")
    .replace(
      /[\u0300-\u036f]/g,
      ""
    );
}


/* =========================
   FORMATEAR HORA
========================= */

function formatearHora(fecha) {

  if (!fecha) {
    return "";
  }


  const d =
    new Date(fecha);


  if (
    Number.isNaN(
      d.getTime()
    )
  ) {

    return "";
  }


  return d.toLocaleTimeString(
    "es-CL",
    {
      hour:
        "2-digit",

      minute:
        "2-digit"
    }
  );
}


/* =========================
   CARGAR PREVENTAS
========================= */

async function cargarPreventas() {

  const lista =
    document.getElementById(
      "lista"
    );


  lista.innerHTML = `

    <tr>

      <td
        colspan="6"
        class="vacio"
      >
        Cargando preventas...
      </td>

    </tr>

  `;


  try {

    const respuesta =
      await fetch(

        "/.netlify/functions/personas?tipo=preventa&t=" +
        Date.now(),

        {
          cache:
            "no-store"
        }
      );


    if (!respuesta.ok) {

      throw new Error(
        "No se pudieron cargar las preventas."
      );
    }


    const datos =
      await respuesta.json();


    preventas =
      Array.isArray(datos)
        ? datos
        : [];


    preventas.sort(
      (a, b) =>

        String(
          a.nombre || ""
        ).localeCompare(
          String(
            b.nombre || ""
          ),
          "es"
        )
    );


    actualizarResumen();

    mostrarPreventas();


  } catch (error) {

    console.error(
      error
    );


    lista.innerHTML = `

      <tr>

        <td
          colspan="6"
          class="vacio"
        >
          ❌ No se pudieron cargar
          las preventas.
        </td>

      </tr>

    `;
  }
}


/* =========================
   RESUMEN
========================= */

function actualizarResumen() {

  const personas =
    preventas.length;


  const totalPreventas =
    preventas.reduce(
      (
        suma,
        persona
      ) =>

        suma +
        Number(
          persona.cantidadPreventas ||
          0
        ),

      0
    );


  const activos =
    preventas.filter(
      persona =>
        persona.activo ===
        true
    ).length;


  document.getElementById(
    "cantidad-personas"
  ).textContent =
    personas;


  document.getElementById(
    "cantidad-preventas"
  ).textContent =
    totalPreventas;


  document.getElementById(
    "cantidad-activos"
  ).textContent =
    activos;
}


/* =========================
   MOSTRAR
========================= */

function mostrarPreventas() {

  const lista =
    document.getElementById(
      "lista"
    );


  const busqueda =
    normalizar(
      document.getElementById(
        "buscar"
      ).value
    );


  const filtradas =
    preventas.filter(
      persona => {

        const nombre =
          normalizar(
            persona.nombre
          );


        const codigo =
          normalizar(
            persona.codigoPreventa
          );


        return (
          !busqueda ||
          nombre.includes(
            busqueda
          ) ||
          codigo.includes(
            busqueda
          )
        );
      }
    );


  lista.innerHTML =
    "";


  if (
    filtradas.length ===
    0
  ) {

    lista.innerHTML = `

      <tr>

        <td
          colspan="6"
          class="vacio"
        >
          ${
            busqueda

              ? "No encontré ninguna preventa con esa búsqueda."

              : "Todavía no hay preventas registradas."
          }
        </td>

      </tr>

    `;


    return;
  }


  filtradas.forEach(
    persona => {

      const fila =
        document.createElement(
          "tr"
        );


      /* =========================
         NOMBRE
      ========================= */

      const tdNombre =
        document.createElement(
          "td"
        );


      tdNombre.className =
        "nombre";


      tdNombre.textContent =
        persona.nombre ||
        "Sin nombre";


      /* =========================
         CANTIDAD
      ========================= */

      const tdCantidad =
        document.createElement(
          "td"
        );


      tdCantidad.className =
        "cantidad";


      tdCantidad.textContent =
        Number(
          persona.cantidadPreventas ||
          0
        );


      /* =========================
         CÓDIGO
      ========================= */

      const tdCodigo =
        document.createElement(
          "td"
        );


      const codigo =
        document.createElement(
          "span"
        );


      codigo.className =
        "codigo";


      codigo.textContent =
        persona.codigoPreventa ||
        "Sin código";


      tdCodigo.appendChild(
        codigo
      );


      if (
        persona.codigoPreventa
      ) {

        const copiar =
          document.createElement(
            "button"
          );


        copiar.className =
          "btn-copiar";


        copiar.textContent =
          "Copiar";


        copiar.onclick =
          () =>
            copiarCodigo(
              persona.codigoPreventa
            );


        tdCodigo.appendChild(
          copiar
        );
      }


      /* =========================
         MESA
      ========================= */

      const tdMesa =
        document.createElement(
          "td"
        );


      if (
        persona.mesa
      ) {

        tdMesa.className =
          "mesa";


        tdMesa.textContent =
          "Mesa " +
          persona.mesa;


      } else {

        tdMesa.className =
          "sin-mesa";


        tdMesa.textContent =
          "Sin mesa";
      }


      /* =========================
         ESTADO
      ========================= */

      const tdEstado =
        document.createElement(
          "td"
        );


      const estado =
        document.createElement(
          "span"
        );


      if (
        persona.activo
      ) {

        estado.className =
          "estado estado-activo";


        estado.textContent =
          "● Activo";


        tdEstado.appendChild(
          estado
        );


        if (
          persona.llegadaEn
        ) {

          const hora =
            document.createElement(
              "span"
            );


          hora.className =
            "hora";


          hora.textContent =
            "Llegó " +
            formatearHora(
              persona.llegadaEn
            );


          tdEstado.appendChild(
            hora
          );
        }


      } else {

        estado.className =
          "estado estado-inactivo";


        estado.textContent =
          "○ No activo";


        tdEstado.appendChild(
          estado
        );
      }


      /* =========================
         ACCIÓN
      ========================= */

      const tdAccion =
        document.createElement(
          "td"
        );


      const boton =
        document.createElement(
          "button"
        );


      const bloqueado =
        cambiandoEstado.has(
          persona.id
        );


      boton.disabled =
        bloqueado;


      if (
        persona.activo
      ) {

        boton.className =
          "btn-inactivo";


        boton.textContent =
          bloqueado
            ? "Guardando..."
            : "Marcar no activo";


        boton.onclick =
          () =>
            cambiarEstado(
              persona.id,
              false
            );


      } else {

        boton.className =
          "btn-activo";


        boton.textContent =
          bloqueado
            ? "Guardando..."
            : "✓ Marcar como llegó";


        boton.onclick =
          () =>
            cambiarEstado(
              persona.id,
              true
            );
      }


      tdAccion.appendChild(
        boton
      );


      /* =========================
         FILA
      ========================= */

      fila.appendChild(
        tdNombre
      );

      fila.appendChild(
        tdCantidad
      );

      fila.appendChild(
        tdCodigo
      );

      fila.appendChild(
        tdMesa
      );

      fila.appendChild(
        tdEstado
      );

      fila.appendChild(
        tdAccion
      );


      lista.appendChild(
        fila
      );

    }
  );
}


/* =========================
   CAMBIAR ESTADO
========================= */

async function cambiarEstado(
  personaId,
  activo
) {

  if (
    cambiandoEstado.has(
      personaId
    )
  ) {
    return;
  }


  const persona =
    preventas.find(
      p =>
        p.id ===
        personaId
    );


  if (!persona) {
    return;
  }


  /*
    Si estamos quitando el estado,
    pedimos confirmación para evitar
    hacerlo por error.
  */

  if (
    activo === false
  ) {

    const confirmar =
      confirm(

        "¿Quieres marcar a " +
        persona.nombre +
        " como No activo?"

      );


    if (!confirmar) {
      return;
    }
  }


  cambiandoEstado.add(
    personaId
  );


  mostrarPreventas();


  try {

    const respuesta =
      await fetch(

        "/.netlify/functions/personas",

        {
          method:
            "POST",

          headers: {
            "Content-Type":
              "application/json"
          },

          body:
            JSON.stringify({

              accion:
                "actualizar-activo",

              personaId,

              activo

            })
        }
      );


    const resultado =
      await respuesta.json();


    if (!respuesta.ok) {

      throw new Error(
        resultado.error ||
        "No se pudo actualizar el estado."
      );
    }


    /*
      Actualizamos inmediatamente
      nuestra copia local.
    */

    const posicion =
      preventas.findIndex(
        p =>
          p.id ===
          personaId
      );


    if (
      posicion !== -1 &&
      resultado.persona
    ) {

      preventas[
        posicion
      ] =
        resultado.persona;
    }


    actualizarResumen();

    mostrarPreventas();


  } catch (error) {

    console.error(
      error
    );


    alert(
      "❌ " +
      error.message
    );


  } finally {

    cambiandoEstado.delete(
      personaId
    );


    /*
      Volvemos a consultar al servidor
      para asegurarnos de tener
      exactamente el estado guardado.
    */

    await cargarPreventas();
  }
}


/* =========================
   COPIAR CÓDIGO
========================= */

async function copiarCodigo(
  codigo
) {

  try {

    await navigator.clipboard
      .writeText(
        codigo
      );


    alert(
      "✅ Código " +
      codigo +
      " copiado."
    );


  } catch (error) {

    alert(
      "Código: " +
      codigo
    );
  }
}


/* =========================
   INICIO
========================= */

cargarPreventas();


/*
  Se refresca cada 10 segundos.

  Así si alguien entra mediante
  el QR desde otra mesa,
  esta página también se actualiza.
*/

setInterval(
  cargarPreventas,
  10000
);


</script>

</body>

</html>
