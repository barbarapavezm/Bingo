<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Cocina - Bingo</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      margin: 0;
      background: #f4f6f8;
      color: #1f2937;
    }

    header {
      background: white;
      padding: 12px 22px;
      border-bottom: 1px solid #ddd;

      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
    }

    header h1 {
      margin: 0;
      font-size: 24px;
    }

    header span {
      color: #6b7280;
      font-size: 13px;
    }

    .acciones-header {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    header a {
      text-decoration: none;
      color: #2563eb;
      font-weight: bold;
      font-size: 14px;
    }

    .btn-actualizar {
      border: 1px solid #d1d5db;
      background: white;
      padding: 8px 12px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 13px;
    }

    main {
      padding: 14px;
      max-width: 1700px;
      margin: auto;
    }

    .columnas {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
    }

    .columna {
      background: #e9edf2;
      border-radius: 12px;
      padding: 10px;

      height: calc(100vh - 105px);

      display: flex;
      flex-direction: column;

      min-width: 0;
    }

    .encabezado-columna {
      display: flex;
      justify-content: space-between;
      align-items: center;

      padding: 2px 4px 9px;
      border-bottom: 1px solid #d1d5db;
      margin-bottom: 9px;
    }

    .encabezado-columna h2 {
      margin: 0;
      font-size: 18px;
    }

    .contador {
      background: white;
      border-radius: 999px;
      padding: 3px 8px;
      font-weight: bold;
      font-size: 12px;
      color: #4b5563;
    }

    .lista-pedidos {
      overflow-y: auto;
      padding-right: 3px;
      flex: 1;
    }

    .pedido {
      background: white;
      border-radius: 9px;
      padding: 10px 11px;
      margin-bottom: 8px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.08);
    }

    .pedido-nuevo {
      border-left: 4px solid #f59e0b;
    }

    .pedido-preparando {
      border-left: 4px solid #2563eb;
    }

    .pedido-listo {
      border-left: 4px solid #10b981;
    }

    .pedido-cabecera {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 8px;
      margin-bottom: 5px;
    }

    .pedido h3 {
      margin: 0;
      font-size: 16px;
    }

    .persona {
      font-weight: bold;
      font-size: 14px;
      color: #374151;
      margin-top: 2px;
    }

    .hora {
      color: #6b7280;
      font-size: 11px;
      text-align: right;
      white-space: nowrap;
    }

    .productos {
      margin-top: 6px;
      padding-top: 6px;
      border-top: 1px solid #eee;
    }

    .producto {
      font-size: 13px;
      padding: 2px 0;
    }

    .producto strong {
      font-size: 14px;
    }

    button {
      border: none;
      border-radius: 7px;
      cursor: pointer;
    }

    .boton-estado {
      width: 100%;
      padding: 7px 8px;
      margin-top: 8px;
      font-size: 12px;
      font-weight: bold;
    }

    .btn-preparar {
      background: #f59e0b;
      color: white;
    }

    .btn-listo {
      background: #2563eb;
      color: white;
    }

    .btn-entregado {
      background: #10b981;
      color: white;
    }

    .vacio {
      text-align: center;
      color: #6b7280;
      font-size: 13px;
      padding: 30px 8px;
    }

    .error {
      background: #fee2e2;
      color: #991b1b;
      padding: 10px;
      border-radius: 8px;
      font-size: 13px;
    }

    .actualizando {
      font-size: 11px;
      color: #6b7280;
    }

    @media (max-width: 900px) {

      .columnas {
        grid-template-columns: 1fr;
      }

      .columna {
        height: auto;
        min-height: 300px;
        max-height: 600px;
      }

      header {
        align-items: flex-start;
      }
    }
  </style>
</head>

<body>

<header>

  <div>
    <h1>Cocina</h1>
    <span>
      Pedidos de las mesas
    </span>
  </div>

  <div class="acciones-header">

    <span
      class="actualizando"
      id="ultima-actualizacion"
    >
    </span>

    <button
      class="btn-actualizar"
      onclick="cargarPedidos()"
    >
      ↻ Actualizar
    </button>

    <a href="/index.html">
      Volver al inicio
    </a>

  </div>

</header>


<main>

  <div class="columnas">

    <!-- NUEVOS -->

    <section class="columna">

      <div class="encabezado-columna">

        <h2>
          🟠 Nuevos
        </h2>

        <span
          class="contador"
          id="contador-nuevos"
        >
          0
        </span>

      </div>

      <div
        class="lista-pedidos"
        id="nuevos"
      >
      </div>

    </section>


    <!-- PREPARANDO -->

    <section class="columna">

      <div class="encabezado-columna">

        <h2>
          🔵 Preparando
        </h2>

        <span
          class="contador"
          id="contador-preparando"
        >
          0
        </span>

      </div>

      <div
        class="lista-pedidos"
        id="preparando"
      >
      </div>

    </section>


    <!-- LISTOS -->

    <section class="columna">

      <div class="encabezado-columna">

        <h2>
          🟢 Listos
        </h2>

        <span
          class="contador"
          id="contador-listos"
        >
          0
        </span>

      </div>

      <div
        class="lista-pedidos"
        id="listos"
      >
      </div>

    </section>

  </div>

</main>


<script>

let actualizando = false;


/* ============================
   SEGURIDAD PARA MOSTRAR TEXTO
============================ */

function escaparHTML(texto) {

  return String(texto ?? "")
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");
}


/* ============================
   FORMATO DE HORA
============================ */

function formatoHora(fechaISO) {

  if (!fechaISO) {
    return "";
  }

  const fecha =
    new Date(fechaISO);

  return fecha.toLocaleTimeString(
    "es-CL",
    {
      hour: "2-digit",
      minute: "2-digit"
    }
  );
}


/* ============================
   MOMENTO EN QUE ENTRÓ
   A LA COLUMNA
============================ */

function fechaCola(pedido) {

  /*
    Para NUEVOS usamos la fecha
    original del pedido.

    Para PREPARANDO y LISTO usamos
    "actualizado", porque representa
    cuándo entró a esa nueva cola.
  */

  if (
    pedido.estado === "nuevo"
  ) {
    return new Date(
      pedido.fecha || 0
    );
  }

  return new Date(
    pedido.actualizado ||
    pedido.fecha ||
    0
  );
}


/* ============================
   CARGAR PEDIDOS REALES
============================ */

async function cargarPedidos() {

  if (actualizando) {
    return;
  }

  actualizando = true;

  try {

    const respuesta =
      await fetch(
        "/.netlify/functions/pedidos",
        {
          cache: "no-store"
        }
      );


    if (!respuesta.ok) {

      throw new Error(
        "No se pudieron cargar los pedidos."
      );

    }


    const pedidos =
      await respuesta.json();


    renderPedidos(
      Array.isArray(pedidos)
        ? pedidos
        : []
    );


    document.getElementById(
      "ultima-actualizacion"
    ).textContent =
      "Actualizado " +
      new Date()
        .toLocaleTimeString(
          "es-CL",
          {
            hour:
              "2-digit",
            minute:
              "2-digit",
            second:
              "2-digit"
          }
        );


  } catch (error) {

    console.error(error);

    mostrarError();

  } finally {

    actualizando = false;

  }
}


/* ============================
   RENDER
============================ */

function renderPedidos(pedidos) {

  const nuevos =
    pedidos
      .filter(
        pedido =>
          pedido.estado ===
          "nuevo"
      )
      .sort(
        (a, b) =>
          fechaCola(a) -
          fechaCola(b)
      );


  const preparando =
    pedidos
      .filter(
        pedido =>
          pedido.estado ===
          "preparando"
      )
      .sort(
        (a, b) =>
          fechaCola(a) -
          fechaCola(b)
      );


  const listos =
    pedidos
      .filter(
        pedido =>
          pedido.estado ===
          "listo"
      )
      .sort(
        (a, b) =>
          fechaCola(a) -
          fechaCola(b)
      );


  renderColumna(
    "nuevos",
    nuevos
  );

  renderColumna(
    "preparando",
    preparando
  );

  renderColumna(
    "listos",
    listos
  );


  document.getElementById(
    "contador-nuevos"
  ).textContent =
    nuevos.length;


  document.getElementById(
    "contador-preparando"
  ).textContent =
    preparando.length;


  document.getElementById(
    "contador-listos"
  ).textContent =
    listos.length;
}


/* ============================
   RENDER DE CADA COLUMNA
============================ */

function renderColumna(
  idContenedor,
  pedidos
) {

  const contenedor =
    document.getElementById(
      idContenedor
    );


  contenedor.innerHTML = "";


  if (
    pedidos.length === 0
  ) {

    contenedor.innerHTML = `
      <div class="vacio">
        No hay pedidos
      </div>
    `;

    return;
  }


  pedidos.forEach(
    pedido => {

      const tarjeta =
        crearTarjetaPedido(
          pedido
        );


      /*
        appendChild agrega al final.

        Como antes ordenamos del
        más antiguo al más nuevo,
        los antiguos quedan arriba
        y los nuevos abajo.
      */

      contenedor.appendChild(
        tarjeta
      );

    }
  );
}


/* ============================
   CREAR TARJETA
============================ */

function crearTarjetaPedido(
  pedido
) {

  const tarjeta =
    document.createElement(
      "div"
    );


  tarjeta.className =
    "pedido pedido-" +
    pedido.estado;


  const productos =
    Array.isArray(
      pedido.productos
    )
      ? pedido.productos
      : [];


  const productosHTML =
    productos
      .map(
        producto => `

          <div class="producto">

            <strong>
              ${Number(
                producto.cantidad || 0
              )} ×
            </strong>

            ${escaparHTML(
              producto.nombre
            )}

          </div>
        `
      )
      .join("");


  let boton = "";


  if (
    pedido.estado ===
    "nuevo"
  ) {

    boton = `

      <button
        class="
          boton-estado
          btn-preparar
        "
        onclick="
          cambiarEstado(
            '${pedido.id}',
            'preparando'
          )
        "
      >
        Empezar a preparar
      </button>
    `;
  }


  if (
    pedido.estado ===
    "preparando"
  ) {

    boton = `

      <button
        class="
          boton-estado
          btn-listo
        "
        onclick="
          cambiarEstado(
            '${pedido.id}',
            'listo'
          )
        "
      >
        Marcar como listo
      </button>
    `;
  }


  if (
    pedido.estado ===
    "listo"
  ) {

    boton = `

      <button
        class="
          boton-estado
          btn-entregado
        "
        onclick="
          cambiarEstado(
            '${pedido.id}',
            'entregado'
          )
        "
      >
        Marcar como entregado
      </button>
    `;
  }


  tarjeta.innerHTML = `

    <div class="pedido-cabecera">

      <div>

        <h3>
          Mesa
          ${Number(
            pedido.mesa
          )}
        </h3>

        <div class="persona">
          ${escaparHTML(
            pedido.nombre ||
            "Sin nombre"
          )}
        </div>

      </div>


      <div class="hora">

        ${formatoHora(
          pedido.fecha
        )}

      </div>

    </div>


    <div class="productos">

      ${productosHTML}

    </div>


    ${boton}
  `;


  return tarjeta;
}


/* ============================
   CAMBIAR ESTADO
============================ */

async function cambiarEstado(
  id,
  nuevoEstado
) {

  try {

    const respuesta =
      await fetch(
        "/.netlify/functions/pedidos",
        {
          method: "PUT",

          headers: {
            "Content-Type":
              "application/json"
          },

          body:
            JSON.stringify({
              id,
              estado:
                nuevoEstado
            })
        }
      );


    const resultado =
      await respuesta.json();


    if (!respuesta.ok) {

      throw new Error(
        resultado.error ||
        "No se pudo actualizar."
      );

    }


    /*
      Recargamos inmediatamente.
      Así el pedido pasa a su nueva
      columna sin esperar los 5 s.
    */

    await cargarPedidos();


  } catch (error) {

    console.error(error);

    alert(
      "No se pudo actualizar el pedido."
    );

  }
}


/* ============================
   ERROR
============================ */

function mostrarError() {

  document.getElementById(
    "nuevos"
  ).innerHTML = `
    <div class="error">
      No se pudieron cargar los pedidos.
    </div>
  `;

}


/* ============================
   INICIO + AUTOACTUALIZACIÓN
============================ */

cargarPedidos();


/*
  Cocina revisa pedidos nuevos
  automáticamente cada 5 segundos.
*/

setInterval(
  cargarPedidos,
  5000
);

</script>

</body>
</html>
