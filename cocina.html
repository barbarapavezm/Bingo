<!DOCTYPE html>
<html lang="es">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Cocina - Bingo</title>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      margin: 0;
      background: #f4f6f8;
      color: #1f2937;
    }

    header {
      background: white;
      padding: 12px 22px;
      border-bottom: 1px solid #ddd;

      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
    }

    header h1 {
      margin: 0;
      font-size: 24px;
    }

    header span {
      color: #6b7280;
      font-size: 13px;
    }

    header a {
      text-decoration: none;
      color: #2563eb;
      font-weight: bold;
      font-size: 14px;
    }

    .acciones-header {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .btn-actualizar {
      border: 1px solid #d1d5db;
      background: white;
      padding: 8px 12px;
      border-radius: 8px;
      cursor: pointer;
    }


    main {
      max-width: 1700px;
      margin: auto;
      padding: 14px;
    }


    /* =======================
       COLUMNAS COCINA
    ======================= */

    .columnas {
      display: grid;
      grid-template-columns:
        repeat(3, 1fr);
      gap: 12px;
    }

    .columna {
      background: #e9edf2;
      border-radius: 12px;
      padding: 10px;

      height:
        calc(100vh - 105px);

      display: flex;
      flex-direction: column;

      min-width: 0;
    }

    .encabezado-columna {
      display: flex;
      justify-content:
        space-between;
      align-items: center;

      padding: 2px 4px 9px;

      border-bottom:
        1px solid #d1d5db;

      margin-bottom: 9px;
    }

    .encabezado-columna h2 {
      margin: 0;
      font-size: 18px;
    }

    .contador {
      background: white;
      border-radius: 999px;
      padding: 3px 8px;
      font-weight: bold;
      font-size: 12px;
    }

    .lista-pedidos {
      overflow-y: auto;
      padding-right: 3px;
      flex: 1;
    }


    /* =======================
       PEDIDOS
    ======================= */

    .pedido {
      background: white;
      border-radius: 9px;

      padding: 10px 11px;
      margin-bottom: 8px;

      box-shadow:
        0 1px 4px
        rgba(0,0,0,.08);
    }

    .pedido-nuevo {
      border-left:
        4px solid #f59e0b;
    }

    .pedido-preparando {
      border-left:
        4px solid #2563eb;
    }

    .pedido-listo {
      border-left:
        4px solid #10b981;
    }

    .pedido-prioritario {
      background: #eff6ff;

      border:
        2px solid #2563eb;
    }

    .prioridad {
      display: inline-block;
      background: #2563eb;
      color: white;

      font-size: 10px;
      font-weight: bold;

      padding: 3px 6px;
      border-radius: 999px;

      margin-bottom: 5px;
    }

    .pedido-cabecera {
      display: flex;
      justify-content:
        space-between;
      align-items:
        flex-start;
      gap: 8px;
    }

    .pedido h3 {
      margin: 0;
      font-size: 16px;
    }

    .persona {
      font-weight: bold;
      font-size: 14px;
      margin-top: 2px;
    }

    .hora {
      color: #6b7280;
      font-size: 11px;
      white-space: nowrap;
    }

    .productos {
      margin-top: 6px;
      padding-top: 6px;

      border-top:
        1px solid #eee;
    }

    .producto {
      font-size: 13px;
      padding: 2px 0;
    }


    button {
      border: none;
      border-radius: 7px;
      cursor: pointer;
    }

    .boton-estado {
      width: 100%;
      padding: 7px 8px;
      margin-top: 8px;

      font-size: 12px;
      font-weight: bold;
    }

    .btn-preparar {
      background: #f59e0b;
      color: white;
    }

    .btn-listo {
      background: #2563eb;
      color: white;
    }

    .btn-entregado {
      background: #10b981;
      color: white;
    }


    /* =======================
       ENTREGADOS
    ======================= */

    .entregados-panel {
      margin-top: 22px;

      background: white;

      border-radius: 14px;

      padding: 18px;

      box-shadow:
        0 2px 8px
        rgba(0,0,0,.08);
    }

    .entregados-cabecera {
      display: flex;
      justify-content:
        space-between;
      align-items: center;

      margin-bottom: 12px;
    }

    .entregados-cabecera h2 {
      margin: 0;
    }

    .tabla-contenedor {
      overflow-x: auto;

      max-height: 420px;
      overflow-y: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    th,
    td {
      padding: 9px 10px;
      border-bottom:
        1px solid #e5e7eb;

      text-align: left;
      vertical-align: top;

      font-size: 13px;
    }

    th {
      background: #f9fafb;

      position: sticky;
      top: 0;
      z-index: 1;
    }

    .entregado-producto {
      margin: 2px 0;
    }

    .btn-reabrir {
      padding: 7px 10px;

      background: #dbeafe;
      color: #1d4ed8;

      font-size: 12px;
      font-weight: bold;

      white-space: nowrap;
    }

    .vacio {
      color: #6b7280;
      text-align: center;
      padding: 30px;
      font-size: 13px;
    }


    /* =======================
       CHAT CAJA ↔ COCINA
    ======================= */

    .btn-chat {
      position: relative;
      border: 1px solid #d1d5db;
      background: white;
      padding: 8px 12px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
      color: #1f2937;
    }

    .chat-badge {
      display: none;
      position: absolute;
      top: -7px;
      right: -7px;
      min-width: 20px;
      height: 20px;
      padding: 0 5px;
      border-radius: 999px;
      background: #dc2626;
      color: white;
      font-size: 11px;
      font-weight: bold;
      align-items: center;
      justify-content: center;
      border: 2px solid white;
    }

    .chat-badge.visible { display: flex; }

    .chat-panel {
      position: fixed;
      right: 18px;
      bottom: 18px;
      width: 370px;
      max-width: calc(100vw - 36px);
      height: 520px;
      max-height: calc(100vh - 120px);
      background: white;
      border: 1px solid #d1d5db;
      border-radius: 14px;
      box-shadow: 0 12px 35px rgba(0,0,0,.22);
      z-index: 1000;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .chat-panel.oculto { display: none; }

    .chat-cabecera {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 13px 14px;
      border-bottom: 1px solid #e5e7eb;
      background: #f9fafb;
    }

    .chat-cerrar {
      width: 32px;
      height: 32px;
      background: #e5e7eb;
      color: #374151;
      font-size: 18px;
      line-height: 1;
    }

    .chat-mensajes {
      flex: 1;
      overflow-y: auto;
      padding: 12px;
      background: #f8fafc;
    }

    .chat-vacio {
      color: #6b7280;
      font-size: 13px;
      text-align: center;
      padding: 30px 10px;
    }

    .chat-fila { display: flex; margin-bottom: 10px; }
    .chat-fila.propia { justify-content: flex-end; }
    .chat-fila.otra { justify-content: flex-start; }

    .chat-burbuja {
      max-width: 82%;
      padding: 9px 11px;
      border-radius: 12px;
      font-size: 13px;
      line-height: 1.35;
      word-break: break-word;
    }

    .chat-fila.propia .chat-burbuja {
      background: #dbeafe;
      border-bottom-right-radius: 4px;
    }

    .chat-fila.otra .chat-burbuja {
      background: white;
      border: 1px solid #e5e7eb;
      border-bottom-left-radius: 4px;
    }

    .chat-meta {
      display: flex;
      gap: 7px;
      align-items: center;
      margin-bottom: 3px;
      color: #6b7280;
      font-size: 10px;
    }

    .chat-meta strong { color: #374151; font-size: 11px; }
    .chat-texto { white-space: pre-wrap; }

    .chat-form {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 8px;
      padding: 10px;
      border-top: 1px solid #e5e7eb;
      background: white;
    }

    .chat-input {
      width: 100%;
      min-width: 0;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      padding: 10px 11px;
      font-size: 16px;
      outline: none;
    }

    .chat-input:focus { border-color: #2563eb; }

    .chat-enviar {
      padding: 10px 14px;
      background: #2563eb;
      color: white;
      font-weight: bold;
      border-radius: 8px;
    }

    .chat-enviar:disabled { opacity: .55; cursor: not-allowed; }

    @media (
      max-width: 900px
    ) {

      .chat-panel {
        right: 10px;
        bottom: 10px;
        width: calc(100vw - 20px);
        max-width: none;
        height: 70vh;
        max-height: 620px;
      }

      .acciones-header {
        flex-wrap: wrap;
        justify-content: flex-end;
      }

      .columnas {
        grid-template-columns: 1fr;
      }

      .columna {
        height: auto;

        min-height: 300px;
        max-height: 600px;
      }

    }

  </style>

</head>


<body>


<header>

  <div>

    <h1>
      Cocina
    </h1>

    <span>
      Pedidos de las mesas
    </span>

  </div>


  <div class="acciones-header">

    <span
      id="ultima-actualizacion"
    >
    </span>


    <button
      id="btn-chat"
      class="btn-chat"
      type="button"
      onclick="alternarChat()"
    >
      💬 Chat
      <span id="chat-badge" class="chat-badge">0</span>
    </button>


    <button
      class="btn-actualizar"
      onclick="cargarPedidos()"
    >
      ↻ Actualizar
    </button>


    <a href="/index.html">
      Volver al inicio
    </a>

  </div>

</header>


<main>


  <!-- =========================
       PEDIDOS ACTIVOS
  ========================== -->


  <div class="columnas">


    <section class="columna">

      <div
        class="encabezado-columna"
      >

        <h2>
          🟠 Nuevos
        </h2>

        <span
          class="contador"
          id="contador-nuevos"
        >
          0
        </span>

      </div>


      <div
        class="lista-pedidos"
        id="nuevos"
      >
      </div>

    </section>



    <section class="columna">

      <div
        class="encabezado-columna"
      >

        <h2>
          🔵 Preparando
        </h2>

        <span
          class="contador"
          id="contador-preparando"
        >
          0
        </span>

      </div>


      <div
        class="lista-pedidos"
        id="preparando"
      >
      </div>

    </section>



    <section class="columna">

      <div
        class="encabezado-columna"
      >

        <h2>
          🟢 Listos
        </h2>

        <span
          class="contador"
          id="contador-listos"
        >
          0
        </span>

      </div>


      <div
        class="lista-pedidos"
        id="listos"
      >
      </div>

    </section>


  </div>


  <!-- =========================
       HISTORIAL ENTREGADOS
  ========================== -->


  <section
    class="entregados-panel"
  >

    <div
      class="entregados-cabecera"
    >

      <div>

        <h2>
          ✅ Pedidos entregados
        </h2>

        <small>
          Historial para verificar
          entregas realizadas.
        </small>

      </div>


      <span
        class="contador"
        id="contador-entregados"
      >
        0
      </span>

    </div>


    <div class="tabla-contenedor">

      <table>

        <thead>

          <tr>

            <th>
              Entregado
            </th>

            <th>
              Mesa / Persona
            </th>

            <th>
              Productos
            </th>

            <th>
              Pedido originalmente
            </th>

            <th>
              Acción
            </th>

          </tr>

        </thead>


        <tbody
          id="tabla-entregados"
        >
        </tbody>

      </table>

    </div>

  </section>


</main>


<!-- =========================
     CHAT CAJA ↔ COCINA
========================== -->

<section id="chat-panel" class="chat-panel oculto" aria-label="Chat entre Caja y Cocina">
  <div class="chat-cabecera">
    <strong>💬 Caja ↔ Cocina</strong>
    <button class="chat-cerrar" type="button" onclick="cerrarChat()" aria-label="Cerrar chat">×</button>
  </div>

  <div id="chat-mensajes" class="chat-mensajes">
    <div class="chat-vacio">Cargando mensajes...</div>
  </div>

  <form class="chat-form" onsubmit="enviarMensajeChat(event)">
    <input id="chat-input" class="chat-input" type="text" maxlength="500" autocomplete="off" placeholder="Escribe un mensaje a Caja..." aria-label="Mensaje para Caja">
    <button id="chat-enviar" class="chat-enviar" type="submit">Enviar</button>
  </form>
</section>


<script>


let actualizando = false;


/* =========================
   CHAT CAJA ↔ COCINA
========================= */

let chatAbierto = false;
let mensajesChat = [];
let enviandoChat = false;

const CHAT_ORIGEN = "Cocina";
const CHAT_OTRO = "Caja";
const CHAT_ULTIMO_VISTO_KEY = "bingo-chat-cocina-ultimo-visto";

function fechaChatValida(fecha) {
  const valor = new Date(fecha || 0).getTime();
  return Number.isFinite(valor) ? valor : 0;
}

function formatoHoraChat(fechaISO) {
  if (!fechaISO) return "";
  const fecha = new Date(fechaISO);
  if (Number.isNaN(fecha.getTime())) return "";
  return fecha.toLocaleTimeString("es-CL", { hour: "2-digit", minute: "2-digit" });
}

function ultimoVistoChat() {
  return localStorage.getItem(CHAT_ULTIMO_VISTO_KEY) || "";
}

function marcarChatComoVisto() {
  if (mensajesChat.length > 0) {
    const ultimo = mensajesChat[mensajesChat.length - 1];
    if (ultimo?.fecha) localStorage.setItem(CHAT_ULTIMO_VISTO_KEY, ultimo.fecha);
  }
  actualizarBadgeChat();
}

function contarMensajesNuevos() {
  const visto = fechaChatValida(ultimoVistoChat());
  return mensajesChat.filter(m => m.origen === CHAT_OTRO && fechaChatValida(m.fecha) > visto).length;
}

function actualizarBadgeChat() {
  const badge = document.getElementById("chat-badge");
  if (!badge) return;
  const nuevos = chatAbierto ? 0 : contarMensajesNuevos();
  badge.textContent = String(nuevos);
  badge.classList.toggle("visible", nuevos > 0);
}

function alternarChat() {
  chatAbierto ? cerrarChat() : abrirChat();
}

function abrirChat() {
  document.getElementById("chat-panel").classList.remove("oculto");
  chatAbierto = true;
  renderChat(true);
  marcarChatComoVisto();
  setTimeout(() => document.getElementById("chat-input")?.focus(), 50);
  cargarMensajesChat(true);
}

function cerrarChat() {
  document.getElementById("chat-panel").classList.add("oculto");
  chatAbierto = false;
  actualizarBadgeChat();
}

async function cargarMensajesChat(forzarScroll = false) {
  try {
    const respuesta = await fetch("/.netlify/functions/mensajes?t=" + Date.now(), { cache: "no-store" });
    if (!respuesta.ok) throw new Error("No se pudieron cargar los mensajes.");
    const datos = await respuesta.json();
    mensajesChat = Array.isArray(datos) ? datos : [];
    mensajesChat.sort((a,b) => fechaChatValida(a.fecha) - fechaChatValida(b.fecha));
    renderChat(forzarScroll);
    if (chatAbierto) marcarChatComoVisto(); else actualizarBadgeChat();
  } catch (error) {
    console.error("Error chat:", error);
    if (chatAbierto) {
      const c = document.getElementById("chat-mensajes");
      if (c) c.innerHTML = '<div class="chat-vacio">No se pudo cargar el chat.</div>';
    }
  }
}

function renderChat(forzarScroll = false) {
  const contenedor = document.getElementById("chat-mensajes");
  if (!contenedor) return;
  const estabaAbajo = contenedor.scrollHeight - contenedor.scrollTop - contenedor.clientHeight < 70;
  contenedor.innerHTML = "";
  if (mensajesChat.length === 0) {
    contenedor.innerHTML = '<div class="chat-vacio">Todavía no hay mensajes.<br>Este chat es solo entre Caja y Cocina.</div>';
    return;
  }
  mensajesChat.forEach(mensaje => {
    const fila = document.createElement("div");
    const propio = mensaje.origen === CHAT_ORIGEN;
    fila.className = "chat-fila " + (propio ? "propia" : "otra");
    const burbuja = document.createElement("div");
    burbuja.className = "chat-burbuja";
    const meta = document.createElement("div");
    meta.className = "chat-meta";
    const origen = document.createElement("strong");
    origen.textContent = mensaje.origen || "—";
    const hora = document.createElement("span");
    hora.textContent = formatoHoraChat(mensaje.fecha);
    const cuerpo = document.createElement("div");
    cuerpo.className = "chat-texto";
    cuerpo.textContent = mensaje.texto || "";
    meta.appendChild(origen);
    meta.appendChild(hora);
    burbuja.appendChild(meta);
    burbuja.appendChild(cuerpo);
    fila.appendChild(burbuja);
    contenedor.appendChild(fila);
  });
  if (forzarScroll || estabaAbajo || chatAbierto) contenedor.scrollTop = contenedor.scrollHeight;
}

async function enviarMensajeChat(event) {
  event.preventDefault();
  if (enviandoChat) return;
  const input = document.getElementById("chat-input");
  const boton = document.getElementById("chat-enviar");
  const texto = String(input.value || "").trim();
  if (!texto) return;
  if (texto.length > 500) { alert("El mensaje puede tener máximo 500 caracteres."); return; }
  try {
    enviandoChat = true;
    boton.disabled = true;
    boton.textContent = "Enviando...";
    const respuesta = await fetch("/.netlify/functions/mensajes", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ origen: CHAT_ORIGEN, texto })
    });
    const resultado = await respuesta.json();
    if (!respuesta.ok) throw new Error(resultado.error || "No se pudo enviar el mensaje.");
    input.value = "";
    await cargarMensajesChat(true);
  } catch (error) {
    console.error("Error enviando mensaje:", error);
    alert("❌ " + error.message);
  } finally {
    enviandoChat = false;
    boton.disabled = false;
    boton.textContent = "Enviar";
    input.focus();
  }
}


/* =========================
   ESCAPAR TEXTO
========================= */


function escaparHTML(texto) {

  return String(
    texto ?? ""
  )

    .replaceAll(
      "&",
      "&amp;"
    )

    .replaceAll(
      "<",
      "&lt;"
    )

    .replaceAll(
      ">",
      "&gt;"
    )

    .replaceAll(
      '"',
      "&quot;"
    )

    .replaceAll(
      "'",
      "&#039;"
    );
}


/* =========================
   FECHA / HORA
========================= */


function formatoHora(
  fechaISO
) {

  if (!fechaISO) {
    return "";
  }

  return new Date(
    fechaISO
  ).toLocaleTimeString(
    "es-CL",
    {
      hour:
        "2-digit",

      minute:
        "2-digit"
    }
  );
}


function formatoFechaHora(
  fechaISO
) {

  if (!fechaISO) {
    return "Sin registro";
  }

  return new Date(
    fechaISO
  ).toLocaleString(
    "es-CL",
    {
      dateStyle:
        "short",

      timeStyle:
        "short"
    }
  );
}


/* =========================
   FECHA PARA COLA
========================= */


function fechaCola(
  pedido
) {

  if (
    pedido.estado ===
    "nuevo"
  ) {

    return new Date(
      pedido.fecha || 0
    );
  }

  return new Date(
    pedido.actualizado ||
    pedido.fecha ||
    0
  );
}


/* =========================
   CARGAR
========================= */


async function cargarPedidos() {

  if (actualizando) {
    return;
  }


  actualizando = true;


  try {

    const respuesta =
      await fetch(
        "/.netlify/functions/pedidos",
        {
          cache:
            "no-store"
        }
      );


    if (!respuesta.ok) {

      throw new Error(
        "No se pudieron cargar los pedidos."
      );
    }


    const pedidos =
      await respuesta.json();


    renderPedidos(
      Array.isArray(
        pedidos
      )
        ? pedidos
        : []
    );


    document.getElementById(
      "ultima-actualizacion"
    ).textContent =
      "Actualizado " +
      new Date()
        .toLocaleTimeString(
          "es-CL",
          {
            hour:
              "2-digit",

            minute:
              "2-digit",

            second:
              "2-digit"
          }
        );


  } catch (error) {

    console.error(
      error
    );


  } finally {

    actualizando =
      false;

  }
}


/* =========================
   RENDER GENERAL
========================= */


function renderPedidos(
  pedidos
) {


  const nuevos =
    pedidos

      .filter(
        p =>
          p.estado ===
          "nuevo"
      )

      .sort(
        (a, b) =>
          fechaCola(a) -
          fechaCola(b)
      );


  const preparando =
    pedidos

      .filter(
        p =>
          p.estado ===
          "preparando"
      )

      .sort(
        (
          a,
          b
        ) => {

          /*
            Pedidos reabiertos van
            primero.
          */

          const prioridadA =
            a.prioridadPreparando
              ? 0
              : 1;

          const prioridadB =
            b.prioridadPreparando
              ? 0
              : 1;


          if (
            prioridadA !==
            prioridadB
          ) {

            return (
              prioridadA -
              prioridadB
            );
          }


          return (
            fechaCola(a) -
            fechaCola(b)
          );
        }
      );


  const listos =
    pedidos

      .filter(
        p =>
          p.estado ===
          "listo"
      )

      .sort(
        (a, b) =>
          fechaCola(a) -
          fechaCola(b)
      );


  const entregados =
    pedidos

      .filter(
        p =>
          p.estado ===
          "entregado"
      )

      /*
        Los últimos entregados
        aparecen primero.
      */

      .sort(
        (a, b) =>

          new Date(
            b.entregadoEn ||
            b.actualizado ||
            b.fecha
          ) -

          new Date(
            a.entregadoEn ||
            a.actualizado ||
            a.fecha
          )
      );


  renderColumna(
    "nuevos",
    nuevos
  );


  renderColumna(
    "preparando",
    preparando
  );


  renderColumna(
    "listos",
    listos
  );


  renderEntregados(
    entregados
  );


  document.getElementById(
    "contador-nuevos"
  ).textContent =
    nuevos.length;


  document.getElementById(
    "contador-preparando"
  ).textContent =
    preparando.length;


  document.getElementById(
    "contador-listos"
  ).textContent =
    listos.length;


  document.getElementById(
    "contador-entregados"
  ).textContent =
    entregados.length;

}


/* =========================
   COLUMNAS
========================= */


function renderColumna(
  id,
  pedidos
) {

  const contenedor =
    document.getElementById(
      id
    );


  contenedor.innerHTML =
    "";


  if (
    pedidos.length === 0
  ) {

    contenedor.innerHTML = `
      <div class="vacio">
        No hay pedidos
      </div>
    `;

    return;
  }


  pedidos.forEach(
    pedido => {

      contenedor.appendChild(
        crearTarjeta(
          pedido
        )
      );

    }
  );
}


/* =========================
   TARJETA
========================= */


function crearTarjeta(
  pedido
) {

  const tarjeta =
    document.createElement(
      "div"
    );


  tarjeta.className =
    "pedido pedido-" +
    pedido.estado;


  if (
    pedido.prioridadPreparando
  ) {

    tarjeta.classList.add(
      "pedido-prioritario"
    );
  }


  const productos =
    Array.isArray(
      pedido.productos
    )
      ? pedido.productos
      : [];


  const productosHTML =
    productos

      .map(
        producto => `

          <div class="producto">

            <strong>
              ${Number(
                producto.cantidad || 0
              )} ×
            </strong>

            ${escaparHTML(
              producto.nombre
            )}

          </div>
        `
      )

      .join("");


  let boton = "";


  if (
    pedido.estado ===
    "nuevo"
  ) {

    boton = `

      <button
        class="
          boton-estado
          btn-preparar
        "
        onclick="
          cambiarEstado(
            '${pedido.id}',
            'preparando'
          )
        "
      >
        Empezar a preparar
      </button>
    `;
  }


  if (
    pedido.estado ===
    "preparando"
  ) {

    boton = `

      <button
        class="
          boton-estado
          btn-listo
        "
        onclick="
          cambiarEstado(
            '${pedido.id}',
            'listo'
          )
        "
      >
        Marcar como listo
      </button>
    `;
  }


  if (
    pedido.estado ===
    "listo"
  ) {

    boton = `

      <button
        class="
          boton-estado
          btn-entregado
        "
        onclick="
          entregarPedido(
            '${pedido.id}'
          )
        "
      >
        Marcar como entregado
      </button>
    `;
  }


  tarjeta.innerHTML = `

    ${
      pedido.prioridadPreparando

        ? `
          <span class="prioridad">
            DEVUELTO A COCINA
          </span>
        `

        : ""
    }


    <div class="pedido-cabecera">

      <div>

        <h3>
          Mesa
          ${Number(
            pedido.mesa
          )}
        </h3>

        <div class="persona">

          ${escaparHTML(
            pedido.nombre ||
            "Sin nombre"
          )}

        </div>

      </div>


      <div class="hora">

        Pedido
        ${formatoHora(
          pedido.fecha
        )}

      </div>

    </div>


    <div class="productos">

      ${productosHTML}

    </div>


    ${boton}
  `;


  return tarjeta;
}


/* =========================
   ENTREGADOS
========================= */


function renderEntregados(
  pedidos
) {

  const tbody =
    document.getElementById(
      "tabla-entregados"
    );


  tbody.innerHTML =
    "";


  if (
    pedidos.length === 0
  ) {

    tbody.innerHTML = `
      <tr>
        <td
          colspan="5"
          class="vacio"
        >
          Todavía no hay pedidos entregados.
        </td>
      </tr>
    `;

    return;
  }


  pedidos.forEach(
    pedido => {

      const productos =
        Array.isArray(
          pedido.productos
        )
          ? pedido.productos
          : [];


      const productosHTML =
        productos

          .map(
            producto => `

              <div class="entregado-producto">

                ${Number(
                  producto.cantidad || 0
                )}
                ×
                ${escaparHTML(
                  producto.nombre
                )}

              </div>
            `
          )

          .join("");


      const entregadoEn =
        pedido.entregadoEn ||
        pedido.actualizado ||
        pedido.fecha;


      const fila =
        document.createElement(
          "tr"
        );


      fila.innerHTML = `

        <td>

          <strong>
            ${formatoFechaHora(
              entregadoEn
            )}
          </strong>

        </td>


        <td>

          <strong>
            Mesa
            ${Number(
              pedido.mesa
            )}
          </strong>

          <br>

          ${escaparHTML(
            pedido.nombre ||
            "Sin nombre"
          )}

        </td>


        <td>

          ${productosHTML}

        </td>


        <td>

          ${formatoFechaHora(
            pedido.fecha
          )}

        </td>


        <td>

          <button
            class="btn-reabrir"
            onclick="
              volverAPreparando(
                '${pedido.id}',
                '${escaparHTML(
                  pedido.nombre ||
                  "Sin nombre"
                )}'
              )
            "
          >
            ↩ Volver a preparando
          </button>

        </td>
      `;


      tbody.appendChild(
        fila
      );

    }
  );
}


/* =========================
   CAMBIAR ESTADO
========================= */


async function cambiarEstado(
  id,
  estado
) {

  try {

    const respuesta =
      await fetch(
        "/.netlify/functions/pedidos",
        {

          method:
            "PUT",

          headers: {
            "Content-Type":
              "application/json"
          },

          body:
            JSON.stringify({
              id,
              estado
            })
        }
      );


    const resultado =
      await respuesta.json();


    if (!respuesta.ok) {

      throw new Error(
        resultado.error ||
        "No se pudo actualizar."
      );
    }


    await cargarPedidos();


  } catch (error) {

    console.error(
      error
    );

    alert(
      "No se pudo actualizar el pedido."
    );

  }
}


/* =========================
   ENTREGAR
========================= */


async function entregarPedido(
  id
) {

  const confirmar =
    confirm(
      "¿Confirmas que este pedido ya fue entregado a la persona?"
    );


  if (!confirmar) {
    return;
  }


  await cambiarEstado(
    id,
    "entregado"
  );
}


/* =========================
   VOLVER A PREPARANDO
========================= */


async function volverAPreparando(
  id,
  nombre
) {

  const confirmar =
    confirm(
      "¿Este pedido fue marcado como entregado por error?\n\n" +

      "Se devolverá a PREPARANDO y aparecerá al inicio de la cola.\n\n" +

      "Persona: " +
      nombre
    );


  if (!confirmar) {
    return;
  }


  await cambiarEstado(
    id,
    "preparando"
  );
}

cargarMensajesChat();


setInterval(

setInterval(
