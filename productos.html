<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Productos - Bingo</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      background: #f4f6f8;
      color: #1f2937;
    }

    header {
      background: white;
      padding: 20px 30px;
      border-bottom: 1px solid #ddd;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    header a {
      text-decoration: none;
      color: #2563eb;
      font-weight: bold;
    }

    main {
      max-width: 1100px;
      margin: auto;
      padding: 30px;
    }

    .panel {
      background: white;
      border-radius: 14px;
      padding: 22px;
      margin-bottom: 24px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    .form-grid {
      display: grid;
      grid-template-columns: 2fr 1fr 1fr 1fr;
      gap: 12px;
      align-items: end;
    }

    label {
      display: block;
      font-weight: bold;
      margin-bottom: 6px;
    }

    input, select {
      width: 100%;
      box-sizing: border-box;
      padding: 11px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 15px;
    }

    button {
      border: none;
      border-radius: 8px;
      cursor: pointer;
      padding: 11px 14px;
      font-size: 15px;
    }

    .btn-principal {
      background: #2563eb;
      color: white;
    }

    .btn-editar {
      background: #e5e7eb;
    }

    .btn-eliminar {
      background: #fee2e2;
      color: #991b1b;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 15px;
    }

    th, td {
      text-align: left;
      padding: 12px;
      border-bottom: 1px solid #e5e7eb;
    }

    th {
      background: #f9fafb;
    }

    .si {
      color: #047857;
      font-weight: bold;
    }

    .no {
      color: #991b1b;
      font-weight: bold;
    }

    .inactivo {
      opacity: 0.5;
    }

    @media (max-width: 800px) {
      .form-grid {
        grid-template-columns: 1fr;
      }

      table {
        font-size: 13px;
      }
    }
  </style>
</head>

<body>

<header>
  <div>
    <h1>Productos</h1>
    <span>Administración de productos y precios</span>
  </div>

  <a href="/index.html">Volver al inicio</a>
</header>

<main>

  <div class="panel">

    <h2>Agregar producto</h2>

    <div class="form-grid">

      <div>
        <label>Nombre</label>
        <input id="nombre" type="text" placeholder="Ej: Sándwich">
      </div>

      <div>
        <label>Precio</label>
        <input id="precio" type="number" min="0" placeholder="1500">
      </div>

      <div>
        <label>Categoría</label>
        <select id="categoria">
          <option value="comida">Comida/Bebida</option>
          <option value="bingo">Bingo</option>
        </select>
      </div>

      <div>
        <label>¿Entregable?</label>
        <select id="entregable">
          <option value="si">Sí</option>
          <option value="no">No</option>
        </select>
      </div>

    </div>

    <button class="btn-principal" style="margin-top:15px;" onclick="agregarProducto()">
      Agregar producto
    </button>

  </div>

  <div class="panel">

    <h2>Productos actuales</h2>

    <table>
      <thead>
        <tr>
          <th>Producto</th>
          <th>Precio</th>
          <th>Categoría</th>
          <th>Entregable</th>
          <th>Activo</th>
          <th>Acciones</th>
        </tr>
      </thead>

      <tbody id="tabla-productos"></tbody>
    </table>

  </div>

</main>

<script>

let productos = [
  { id: 1, nombre: "Completo", precio: 1500, categoria: "comida", entregable: true, activo: true },
  { id: 2, nombre: "Té", precio: 1000, categoria: "comida", entregable: true, activo: true },
  { id: 3, nombre: "Café", precio: 1000, categoria: "comida", entregable: true, activo: true },
  { id: 4, nombre: "Bebida", precio: 1000, categoria: "comida", entregable: true, activo: true },
  { id: 5, nombre: "Agua", precio: 500, categoria: "comida", entregable: true, activo: true },

  { id: 6, nombre: "Juego 1", precio: 1000, categoria: "bingo", entregable: false, activo: true },
  { id: 7, nombre: "Juego 2", precio: 1000, categoria: "bingo", entregable: false, activo: true },
  { id: 8, nombre: "Juego 3", precio: 1000, categoria: "bingo", entregable: false, activo: true },
  { id: 9, nombre: "Juego 4", precio: 1000, categoria: "bingo", entregable: false, activo: true },
  { id: 10, nombre: "Juego Mayor", precio: 2000, categoria: "bingo", entregable: false, activo: true },
  { id: 11, nombre: "Pack de 11", precio: 5000, categoria: "bingo", entregable: false, activo: true },
  { id: 12, nombre: "Preventa", precio: 4000, categoria: "bingo", entregable: false, activo: true }
];

function formatoCLP(valor) {
  return new Intl.NumberFormat("es-CL", {
    style: "currency",
    currency: "CLP",
    maximumFractionDigits: 0
  }).format(valor);
}

function renderProductos() {

  const tbody = document.getElementById("tabla-productos");
  tbody.innerHTML = "";

  productos.forEach(producto => {

    const fila = document.createElement("tr");

    if (!producto.activo) {
      fila.className = "inactivo";
    }

    fila.innerHTML = `
      <td>${producto.nombre}</td>
      <td>${formatoCLP(producto.precio)}</td>
      <td>${producto.categoria === "comida" ? "Comida/Bebida" : "Bingo"}</td>
      <td class="${producto.entregable ? "si" : "no"}">
        ${producto.entregable ? "Sí" : "No"}
      </td>
      <td>
        ${producto.activo ? "Activo" : "Inactivo"}
      </td>
      <td>
        <button class="btn-editar" onclick="editarProducto(${producto.id})">
          Editar
        </button>

        <button class="btn-editar" onclick="cambiarActivo(${producto.id})">
          ${producto.activo ? "Desactivar" : "Activar"}
        </button>

        <button class="btn-eliminar" onclick="eliminarProducto(${producto.id})">
          Eliminar
        </button>
      </td>
    `;

    tbody.appendChild(fila);
  });
}

function agregarProducto() {

  const nombre = document.getElementById("nombre").value.trim();
  const precio = Number(document.getElementById("precio").value);
  const categoria = document.getElementById("categoria").value;
  const entregable = document.getElementById("entregable").value === "si";

  if (!nombre) {
    alert("Escribe el nombre del producto.");
    return;
  }

  if (!precio || precio < 0) {
    alert("Ingresa un precio válido.");
    return;
  }

  const nuevoProducto = {
    id: Date.now(),
    nombre,
    precio,
    categoria,
    entregable,
    activo: true
  };

  productos.push(nuevoProducto);

  document.getElementById("nombre").value = "";
  document.getElementById("precio").value = "";

  renderProductos();
}

function editarProducto(id) {

  const producto = productos.find(p => p.id === id);

  if (!producto) return;

  const nuevoNombre = prompt("Nombre del producto:", producto.nombre);
  if (nuevoNombre === null) return;

  const nuevoPrecio = prompt("Precio:", producto.precio);
  if (nuevoPrecio === null) return;

  producto.nombre = nuevoNombre.trim() || producto.nombre;
  producto.precio = Number(nuevoPrecio) || producto.precio;

  renderProductos();
}

function cambiarActivo(id) {

  const producto = productos.find(p => p.id === id);

  if (!producto) return;

  producto.activo = !producto.activo;

  renderProductos();
}

function eliminarProducto(id) {

  const producto = productos.find(p => p.id === id);

  if (!producto) return;

  const confirmar = confirm(
    "¿Seguro que quieres eliminar " + producto.nombre + "?"
  );

  if (!confirmar) return;

  productos = productos.filter(p => p.id !== id);

  renderProductos();
}

renderProductos();

</script>

</body>
</html>
