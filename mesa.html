<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Mesa - Bingo</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      background: #f4f6f8;
      color: #1f2937;
    }

    header {
      background: white;
      padding: 20px 30px;
      border-bottom: 1px solid #ddd;
    }

    main {
      max-width: 850px;
      margin: auto;
      padding: 25px;
    }

    .persona {
      background: white;
      border-radius: 14px;
      padding: 20px;
      margin-bottom: 18px;
      box-shadow: 0 2px 8px rgba(0,0,0,.08);
    }

    .persona h2 {
      margin-top: 0;
    }

    .producto {
      display: grid;
      grid-template-columns: 1fr auto auto;
      gap: 15px;
      padding: 8px 0;
      border-bottom: 1px solid #eee;
    }

    .btn {
      display: inline-block;
      margin-top: 15px;
      padding: 11px 15px;
      background: #2563eb;
      color: white;
      text-decoration: none;
      border-radius: 8px;
      font-weight: bold;
    }

    .vacio {
      background: white;
      padding: 30px;
      border-radius: 14px;
      text-align: center;
      color: #6b7280;
    }

    .volver {
      color: #2563eb;
      text-decoration: none;
    }
  </style>
</head>

<body>

<header>

  <h1 id="titulo">
    Mesa
  </h1>

  <a
    class="volver"
    href="/mesas.html">
    ← Volver a mesas
  </a>

</header>

<main>

  <div id="contenido">
    Cargando...
  </div>

</main>


<script>

const params =
  new URLSearchParams(
    window.location.search
  );

const mesa =
  Number(
    params.get("numero")
  );

document.getElementById(
  "titulo"
).textContent =
  "Mesa " + mesa;


function normalizar(texto) {
  return String(texto || "")
    .trim()
    .toLowerCase();
}


async function cargar() {

  const contenido =
    document.getElementById(
      "contenido"
    );

  try {

    const [
      respuestaVentas,
      respuestaPedidos
    ] = await Promise.all([

      fetch(
        "/.netlify/functions/ventas"
      ),

      fetch(
        "/.netlify/functions/pedidos"
      )

    ]);


    const ventas =
      await respuestaVentas.json();

    const pedidos =
      respuestaPedidos.ok
        ? await respuestaPedidos.json()
        : [];


    const ventasMesa =
      ventas.filter(
        venta =>
          Number(venta.mesa) === mesa
      );


    if (ventasMesa.length === 0) {

      contenido.innerHTML = `
        <div class="vacio">
          Esta mesa todavía no tiene compras.
        </div>
      `;

      return;
    }


    const personas = {};


    ventasMesa.forEach(
      venta => {

        const nombre =
          venta.nombre ||
          "Sin nombre";

        const clave =
          normalizar(nombre);


        if (!personas[clave]) {

          personas[clave] = {
            nombre,
            productos: {}
          };

        }


        const productos =
          Array.isArray(
            venta.productos
          )
            ? venta.productos
            : [];


        productos.forEach(
          producto => {

            if (
              producto.categoria !==
              "comida"
            ) {
              return;
            }


            if (
              !personas[clave]
                .productos[
                  producto.nombre
                ]
            ) {

              personas[clave]
                .productos[
                  producto.nombre
                ] = {
                  comprados: 0,
                  pedidos: 0
                };

            }


            personas[clave]
              .productos[
                producto.nombre
              ].comprados +=
                Number(
                  producto.cantidad || 0
                );

          }
        );

      }
    );


    // Sumar productos ya pedidos
    pedidos
      .filter(
        pedido =>
          Number(pedido.mesa) === mesa
      )
      .forEach(
        pedido => {

          const clave =
            normalizar(
              pedido.nombre
            );

          if (!personas[clave]) {
            return;
          }

          pedido.productos.forEach(
            producto => {

              if (
                personas[clave]
                  .productos[
                    producto.nombre
                  ]
              ) {

                personas[clave]
                  .productos[
                    producto.nombre
                  ].pedidos +=
                    Number(
                      producto.cantidad || 0
                    );

              }

            }
          );

        }
      );


    contenido.innerHTML = "";


    Object.values(
      personas
    ).forEach(
      persona => {

        const tarjeta =
          document.createElement(
            "div"
          );

        tarjeta.className =
          "persona";


        let productosHTML = "";


        Object.entries(
          persona.productos
        ).forEach(
          ([nombre, datos]) => {

            const disponibles =
              Math.max(
                0,
                datos.comprados -
                datos.pedidos
              );


            productosHTML += `

              <div class="producto">

                <span>
                  ${nombre}
                </span>

                <span>
                  Comprados:
                  ${datos.comprados}
                </span>

                <span>
                  Disponibles:
                  <strong>
                    ${disponibles}
                  </strong>
                </span>

              </div>
            `;

          }
        );


        tarjeta.innerHTML = `

          <h2>
            ${persona.nombre}
          </h2>

          ${
            productosHTML ||
            "<p>Solo tiene compras de bingo.</p>"
          }

          <a
            class="btn"
            href="/persona.html?mesa=${mesa}&nombre=${encodeURIComponent(persona.nombre)}"
          >
            Entrar a la cuenta de
            ${persona.nombre}
          </a>
        `;


        contenido.appendChild(
          tarjeta
        );

      }
    );


  } catch (error) {

    console.error(error);

    contenido.innerHTML = `
      <div class="vacio">
        No se pudo cargar esta mesa.
      </div>
    `;

  }
}


cargar();

</script>

</body>
</html>
