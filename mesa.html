<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mesas - Bingo</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      background: #f4f6f8;
      color: #1f2937;
    }

    header {
      background: white;
      padding: 20px 30px;
      border-bottom: 1px solid #ddd;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    header a {
      text-decoration: none;
      color: #2563eb;
      font-weight: bold;
    }

    main {
      max-width: 1200px;
      margin: auto;
      padding: 30px;
    }

    .resumen {
      background: white;
      padding: 20px;
      border-radius: 14px;
      margin-bottom: 25px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 15px;
    }

    .mesa {
      background: white;
      border-radius: 14px;
      padding: 18px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
      border: 2px solid #e5e7eb;
    }

    .mesa.activa {
      border-color: #f59e0b;
    }

    .mesa h3 {
      margin-top: 0;
      margin-bottom: 12px;
    }

    .dato {
      font-size: 14px;
      margin: 5px 0;
      color: #4b5563;
    }

    .estado {
      display: inline-block;
      margin-top: 10px;
      padding: 6px 10px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: bold;
      background: #e5e7eb;
    }

    .estado.activo {
      background: #fef3c7;
      color: #92400e;
    }

    .btn {
      display: inline-block;
      margin-top: 14px;
      text-decoration: none;
      background: #2563eb;
      color: white;
      padding: 9px 12px;
      border-radius: 8px;
      font-size: 14px;
    }

    .cargando {
      color: #6b7280;
    }
  </style>
</head>

<body>

<header>
  <div>
    <h1>Mesas</h1>
    <span>Vista general de las 50 mesas</span>
  </div>

  <a href="/index.html">Volver al inicio</a>
</header>

<main>

  <div class="resumen">
    <strong>Total de mesas:</strong> 50
    <br>
    <span id="estado-carga" class="cargando">
      Cargando información real...
    </span>
  </div>

  <div class="grid" id="grid-mesas"></div>

</main>

<script>

async function obtenerVentas() {

  const respuesta = await fetch(
    "/.netlify/functions/ventas"
  );

  if (!respuesta.ok) {
    throw new Error("No se pudieron cargar las ventas.");
  }

  return await respuesta.json();
}


async function crearMesas() {

  const grid =
    document.getElementById("grid-mesas");

  const estadoCarga =
    document.getElementById("estado-carga");

  try {

    const ventas =
      await obtenerVentas();

    for (let numeroMesa = 1; numeroMesa <= 50; numeroMesa++) {

      const ventasMesa =
        ventas.filter(
          venta =>
            Number(venta.mesa) === numeroMesa
        );

      let productosDisponibles = 0;

      const personas = new Set();

      ventasMesa.forEach(venta => {

        if (venta.nombre) {
          personas.add(venta.nombre);
        }

        const productos =
          Array.isArray(venta.productos)
            ? venta.productos
            : [];

        productos.forEach(producto => {

          // Solo comida/bebida se considera
          // disponible para pedir a la mesa.
          if (producto.categoria === "comida") {

            productosDisponibles +=
              Number(producto.cantidad || 0);
          }

        });
      });


      const tieneActividad =
        ventasMesa.length > 0;

      const tarjeta =
        document.createElement("div");

      tarjeta.className =
        "mesa" +
        (tieneActividad ? " activa" : "");

      tarjeta.innerHTML = `

        <h3>
          Mesa ${numeroMesa}
        </h3>

        <div class="dato">
          Productos disponibles:
          <strong>
            ${productosDisponibles}
          </strong>
        </div>

        <div class="dato">
          Personas con compra:
          <strong>
            ${personas.size}
          </strong>
        </div>

        <div class="dato">
          Pedidos activos:
          <strong>0</strong>
        </div>

        <div class="estado ${tieneActividad ? "activo" : ""}">
          ${
            tieneActividad
              ? "Con compras"
              : "Sin actividad"
          }
        </div>

        <br>

        <a
          class="btn"
          href="/mesa.html?numero=${numeroMesa}"
        >
          Ver detalle
        </a>
      `;

      grid.appendChild(tarjeta);
    }

    estadoCarga.textContent =
      "Información actualizada con las ventas registradas.";

  } catch (error) {

    console.error(error);

    estadoCarga.textContent =
      "No se pudo cargar la información.";

  }
}

crearMesas();

</script>

</body>
</html>
